name: Build iOS (chưa ký)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-build.yml'
      - 'ios/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Cài dependency
        run: npm ci
      - name: Đồng bộ giao diện vào project iOS
        run: npx cap sync ios
      - name: Kiểm tra Xcode
        run: xcodebuild -version
      - name: Build cho iPhone (không ký)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Đóng gói bản chưa ký
        run: |
          mkdir -p "$RUNNER_TEMP/ios-output"
          ditto -c -k --keepParent "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ios-output/Chung-minh-iOS-unsigned.zip"
          printf '%s\n' 'Bản build chưa ký, không thể cài trực tiếp lên iPhone.' > "$RUNNER_TEMP/ios-output/README.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-build
          path: ${{ runner.temp }}/ios-output/
          if-no-files-found: error
          retention-days: 7
